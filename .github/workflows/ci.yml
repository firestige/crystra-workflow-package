name: Crystra Workflow CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crystra-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read exact contract input
        id: contracts
        run: |
          echo "repository=$(jq -er .repository config/development-contract.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -er .revision config/development-contract.json)" >> "$GITHUB_OUTPUT"
      - name: Check out exact Workflow Contract
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.contracts.outputs.repository }}
          ref: ${{ steps.contracts.outputs.revision }}
          path: .crystra-inputs/contracts
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - name: Install Workflow Contract dependencies
        run: npm --prefix .crystra-inputs/contracts/workflow-dsl-2-candidate ci --ignore-scripts
      - name: Qualify first-party packages and release tools
        run: |
          node .crystra-inputs/contracts/workflow-dsl-2-candidate/generated/tools/check-example.cjs hello-world-workflow/definition
          node .crystra-inputs/contracts/workflow-dsl-2-candidate/generated/tools/check-example.cjs system-design/definition
          node .crystra-inputs/contracts/workflow-dsl-2-candidate/generated/tools/check-example.cjs implementation/definition
          node --test test/tooling/dsl2-first-party-migration.test.cjs test/tooling/release/release.test.cjs
      - name: Run Implementation CLI suite
        working-directory: implementation/cli
        run: |
          npm test
          npm run check
